services:
  xianyu-app:
    image: ${DOCKER_IMAGE:-muzileee/xianyu-super-butler}:${IMAGE_TAG:-latest}
    container_name: xianyu-super-butler
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SQL_LOG_ENABLED: "false"
    shm_size: "512m"
